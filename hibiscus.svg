<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="petalGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ff2f6b"/>
      <stop offset="55%" stop-color="#ff4d7a"/>
      <stop offset="100%" stop-color="#e8155a"/>
    </radialGradient>
    <linearGradient id="petalShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(110,110)">
    <!-- five overlapping petals -->
    <g fill="url(#petalGrad)" stroke="#c9114f" stroke-width="0.6">
      <path d="M0,-4 C 34,-30 58,-18 60,10 C 62,40 34,58 0,44 C -8,32 -8,4 0,-4 Z" transform="rotate(0)"/>
      <path d="M0,-4 C 34,-30 58,-18 60,10 C 62,40 34,58 0,44 C -8,32 -8,4 0,-4 Z" transform="rotate(72)"/>
      <path d="M0,-4 C 34,-30 58,-18 60,10 C 62,40 34,58 0,44 C -8,32 -8,4 0,-4 Z" transform="rotate(144)"/>
      <path d="M0,-4 C 34,-30 58,-18 60,10 C 62,40 34,58 0,44 C -8,32 -8,4 0,-4 Z" transform="rotate(216)"/>
      <path d="M0,-4 C 34,-30 58,-18 60,10 C 62,40 34,58 0,44 C -8,32 -8,4 0,-4 Z" transform="rotate(288)"/>
    </g>
    <!-- soft highlight overlay on each petal -->
    <g fill="url(#petalShade)">
      <path d="M0,-4 C 34,-30 58,-18 60,10 C 62,40 34,58 0,44 C -8,32 -8,4 0,-4 Z" transform="rotate(0)"/>
      <path d="M0,-4 C 34,-30 58,-18 60,10 C 62,40 34,58 0,44 C -8,32 -8,4 0,-4 Z" transform="rotate(144)"/>
      <path d="M0,-4 C 34,-30 58,-18 60,10 C 62,40 34,58 0,44 C -8,32 -8,4 0,-4 Z" transform="rotate(288)"/>
    </g>

    <!-- center -->
    <circle r="9" fill="#c9114f"/>
    <circle r="5" fill="#a80d40"/>

    <!-- protruding pistil, classic hibiscus silhouette -->
    <g transform="rotate(-18)">
      <rect x="-2.2" y="-2" width="4.4" height="46" rx="2.2" fill="#e8155a" stroke="#a80d40" stroke-width="0.5"/>
      <g fill="#f7b733" stroke="#c9820f" stroke-width="0.4">
        <circle cx="0" cy="44" r="4.4"/>
        <circle cx="6" cy="40" r="4"/>
        <circle cx="-6" cy="40" r="4"/>
        <circle cx="4" cy="47" r="3.6"/>
        <circle cx="-4" cy="47" r="3.6"/>
      </g>
    </g>
  </g>
</svg>
